name: Parity gate

# Go vs Python cross-engine lockstep parity (cambia-1234).
#
# Migration acceptance for retiring the Python reference engine (cambia-1424):
# while both engines exist, they must agree. Go (engine/) is the RULES.md
# reference. ci.yml holds each engine to its own tests (go-tests for engine/,
# cfr for the Python suite); what this workflow adds is the comparison between
# them, a lockstep replay over the seed set in cfr/tests/parity_seeds.py that
# fails on the first disagreement in acting player, legal action set, pile
# lengths, hands, token stream or terminal utilities.
#
# Still a separate workflow rather than a job in ci.yml, for two reasons that
# outlived the original one. cambia-1246 lifted the workflow-level
# `paths-ignore: cfr/**` that used to make a job there impossible, so that half
# of this note was stale (cambia-1920); what stands is:
#   - GitHub has no per-job path filter. A job in ci.yml would build
#     libcambia and install torch on every non-docs pull request, web-only ones
#     included. The `paths` below hold this to the two engines and what feeds
#     them.
#   - parity-gate is a required check by name, and a job in ci.yml reports
#     under a different one.
#
# Retires with cambia-1430, alongside the Python engine.

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'cfr/src/game/**'
      - 'cfr/src/encoding.py'
      - 'cfr/tests/**'
      - 'Makefile'
      - '.github/workflows/parity-gate.yml'
  push:
    branches: [master]
    paths:
      - 'engine/**'
      - 'cfr/src/game/**'
      - 'cfr/src/encoding.py'
      - 'cfr/tests/**'
      - 'Makefile'
      - '.github/workflows/parity-gate.yml'

jobs:
  parity-gate:
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.environment }}-go-${{ hashFiles('go.work.sum', 'engine/go.sum', 'service/go.sum') }}
          restore-keys: |
            ${{ runner.environment }}-go-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cfr/pyproject.toml

      # The CPU torch extra: tests/test_cross_validation.py imports torch at
      # module load for the encoding-dimension checks. Nothing here runs on a
      # GPU, so the cpu index keeps the wheel small.
      - name: Install cfr (cpu extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./cfr[cpu,test] \
            --extra-index-url https://download.pytorch.org/whl/cpu

      # Builds libcambia.so, pins the interpreter at this checkout, then runs
      # the lockstep suite over the declared seed constant
      # (cfr/tests/parity_seeds.py, default 40) at 2 and 4 seats. A divergence
      # fails naming the seed, the step, and the comparison that broke.
      - name: Parity gate
        run: make parity-gate
