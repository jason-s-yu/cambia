name: CI

# cfr/** is excluded here on purpose; lifting that is the sprint-2 CI ticket.
# One cfr path set is already covered, in its own workflow: the Go vs Python
# parity gate (.github/workflows/parity-gate.yml, cambia-1234) triggers on
# engine/**, cfr/src/game/** and cfr/src/encoding.py. It has to be a separate
# workflow because this paths-ignore skips the whole workflow on a cfr-only
# change and GitHub has no per-job path filter.
on:
  pull_request:
    paths-ignore:
      - 'cfr/**'
      - '.docs/**'
      - 'docs/**'
  push:
    branches: [master]
    paths-ignore:
      - 'cfr/**'
      - '.docs/**'
      - 'docs/**'

jobs:
  go-tests:
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.environment }}-go-${{ hashFiles('go.work.sum', 'engine/go.sum', 'service/go.sum') }}
          restore-keys: |
            ${{ runner.environment }}-go-

      - name: Engine tests
        run: cd engine && go test ./...

      - name: Service tests
        run: cd service && go test ./...

  web:
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.environment }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.environment }}-npm-

      - run: npm ci
      - run: npm run lint
      # The unit tests (node --test) read src/ directly, so they run before the
      # build and fail on their own line rather than inside it (cambia-971).
      - run: npm test
      - run: npm run build
      # Reads dist/, so it has to follow the build (cambia-914, DL-8 review F2).
      - run: npm run check-tokens
