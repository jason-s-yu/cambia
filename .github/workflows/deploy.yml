name: Deploy

concurrency:
  group: deploy-hawking
  cancel-in-progress: false

on:
  push:
    branches: [master]
    paths:
      - 'engine/**'
      - 'service/**'
      - 'runnerd/**'
      - 'web/**'
      - 'go.work'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-server:
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          push: true
          tags: |
            ghcr.io/jason-s-yu/cambia-server:${{ github.sha }}
            ghcr.io/jason-s-yu/cambia-server:latest

  build-web:
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.environment }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.environment }}-npm-

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - name: Deploy static assets to hawking
        env:
          SSH_KEY: ${{ secrets.CAMBIA_WEB_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HAWKING_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.HAWKING_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/cambia_web_deploy_key
          chmod 600 ~/.ssh/cambia_web_deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Destination is "/" because the key is rrsync-restricted to
          # /var/www/cambia.jasonyu.io on hawking; rrsync joins the client path
          # to that root, so an absolute path here would nest under it.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/cambia_web_deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            web/dist/ "$DEPLOY_USER@157.245.172.131:/"

  deploy:
    needs: [build-server, build-web]
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '"ubuntu-latest"') }}
    steps:
      - name: Update hawking compose stack
        env:
          SSH_KEY: ${{ secrets.CAMBIA_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HAWKING_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.HAWKING_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/cambia_deploy_key
          chmod 600 ~/.ssh/cambia_deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/cambia_deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@157.245.172.131" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          IMAGE_TAG="$1"
          cd /opt/cambia
          if grep -q '^CAMBIA_IMAGE_TAG=' .env 2>/dev/null; then
            sed -i "s|^CAMBIA_IMAGE_TAG=.*|CAMBIA_IMAGE_TAG=${IMAGE_TAG}|" .env
          else
            echo "CAMBIA_IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi
          docker compose pull
          docker compose up -d
          REMOTE
